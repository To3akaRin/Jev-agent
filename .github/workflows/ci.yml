name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src Tests/python scripts/*.py
      - run: uv run --no-sync pytest Tests/python
      - run: uv run --no-sync python scripts/check_docs.py
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked --group dev
      - run: swift test
      - run: bash scripts/build-app.sh
