[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-agent"
version = "0.1.0"
description = "Context-aware clipboard decisions for macOS"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["typesafe-sdk==0.7.0"]

[project.optional-dependencies]
laya = ["laya-mlx==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["Tests/python"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
